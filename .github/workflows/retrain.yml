name: self-distilling-retrain

# The automation heartbeat. Runs on a schedule AND on a manual button.
on:
  schedule:
    - cron: "0 8 * * *"     # every day at 08:00 UTC — change to your cadence
  workflow_dispatch: {}       # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write             # needed so the job can commit the new state back

# Never let two retrain runs execute at once — a second trigger waits for the
# first to finish, so runs can't overwrite each other's data.
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync to the very latest state before running
        run: |
          git config user.name "retrain-bot"
          git config user.email "actions@github.com"
          # The checkout can be a moment behind; pull the newest main so the
          # pipeline reads the true current labeled.jsonl and appends to it.
          git pull --no-rebase origin main || true

      - name: Run the self-distilling pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/run_pipeline.py

      - name: Commit updated model, data, and report
        run: |
          git add -A
          git commit -m "retrain: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          # Push, retrying on races. If rejected, pull the newest main and re-run
          # is NOT needed here because we synced before running; a simple rebase
          # of our single commit onto the latest main resolves any race.
          for i in 1 2 3 4 5; do
            git push && break
            echo "push attempt $i rejected; rebasing onto latest main..."
            git pull --rebase -X theirs origin main || git rebase --abort || true
            sleep 4
          done
