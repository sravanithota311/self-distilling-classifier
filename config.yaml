# ---- Self-Distilling Classifier config ----
# Tweak these; everything else reads from here.

# What the teacher (Claude) decides. Rewrite this question to change the task
# entirely — that one line redefines what your model learns.
task_question: >
  Is this paper primarily about large language models, LLM agents,
  or retrieval-augmented generation? Answer strictly about the main topic.

# Data source
arxiv_category: "cs.CL"      # try cs.LG, cs.AI, stat.ML, cs.CV ...
batch_size: 40               # abstracts pulled per run

# Teacher (labeling) model — cheap model is ideal for labeling.
# If you get an HTTP 400 "model not found", check the current model list at
# https://docs.claude.com/en/docs/about-claude/models and update this string.
teacher_model: "claude-haiku-4-5-20251001"

# Promotion rule: challenger must beat champion agreement by at least this much
promotion_margin: 0.0

# Drift: flag when this run's agreement drops more than this below the
# rolling average of recent runs
drift_threshold: 0.05
rolling_window: 5 
#
